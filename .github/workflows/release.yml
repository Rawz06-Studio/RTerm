name: Release

# Every push to the default branch publishes a new release: the version is the
# latest v* tag with its patch number incremented. Run the workflow manually
# to bump the minor or major number instead.
#
# The version lives in git tags only: nothing is committed back. The builds
# receive it through RTERM_VERSION, which is what the app shows in its About
# window and what `rterm --version` prints.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        default: patch
        options: [patch, minor, major]

# Two releases must never compute the same version: run them one at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Compute the next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history and tags are needed to find the latest version.
          fetch-depth: 0

      - id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [[ -z "$latest" ]]; then
            # First release: start from the version written in Cargo.toml.
            next="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            next="$major.$minor.$patch"
          fi
          echo "Previous: ${latest:-none} -> next: v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  macos:
    name: Build and package (macOS)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build, sign and package RTerm.app
        run: scripts/bundle-macos.sh "$VERSION"

      - name: Check the packaged version
        run: |
          reported="$(dist/RTerm.app/Contents/MacOS/rterm --version)"
          echo "$reported"
          test "$reported" = "RTerm $VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/RTerm-*.dmg
            dist/RTerm-*.zip
            dist/RTerm-*.sha256
          if-no-files-found: error

  linux:
    name: Build and package (Linux ${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # The oldest supported runners: the binary then runs on any distribution
    # with this glibc or a newer one.
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install the libraries GPUI needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev \
            libx11-xcb-dev libfontconfig-dev libfreetype-dev libvulkan-dev \
            libssl-dev libzstd-dev zsh file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build and package (tar.gz and AppImage)
        run: scripts/bundle-linux.sh "$VERSION"

      - name: Check the packaged version
        run: |
          reported="$(./dist/RTerm-*.AppImage --appimage-extract-and-run --version)"
          echo "$reported"
          test "$reported" = "RTerm $VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/RTerm-*.tar.gz
            dist/RTerm-*.AppImage
            dist/RTerm-*.sha256
          if-no-files-found: error

  windows:
    name: Build and package (Windows)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build and package
        shell: pwsh
        run: scripts/bundle-windows.ps1 $env:VERSION

      - name: Check the packaged version
        shell: pwsh
        run: |
          # A graphical program: its output only shows through a pipe.
          $reported = (& target/release/rterm.exe --version | Out-String).Trim()
          Write-Host $reported
          if ($reported -ne "RTerm $env:VERSION") { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/RTerm-*-setup.exe
            dist/RTerm-*.zip
            dist/RTerm-*.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RTerm $VERSION" \
            --generate-notes \
            dist/*
