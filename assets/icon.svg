<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    RTerm icon.
    Two command blocks (one of them failed, with a red edge bar) above the
    prompt: the essence of the interface. The colors are those of the
    "RTerm Dark" theme. The shape follows the macOS icon grid: an 824 px
    rounded square centered in a 1024 px canvas.
  -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2232"/>
      <stop offset="1" stop-color="#0c0e13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ad4ff"/>
      <stop offset="1" stop-color="#4c8fee"/>
    </linearGradient>
    <clipPath id="shape">
      <rect x="100" y="100" width="824" height="824" rx="186"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#background)"/>

  <g clip-path="url(#shape)">
    <!-- Successful block -->
    <rect x="100" y="196" width="824" height="132" fill="#ffffff" fill-opacity="0.045"/>
    <rect x="196" y="232" width="210" height="22" rx="11" fill="#d7dce5" fill-opacity="0.80"/>
    <rect x="196" y="274" width="400" height="18" rx="9" fill="#d7dce5" fill-opacity="0.30"/>

    <!-- Failed block -->
    <rect x="100" y="344" width="824" height="132" fill="#f0717b" fill-opacity="0.10"/>
    <rect x="100" y="344" width="14" height="132" fill="#f0717b"/>
    <rect x="196" y="380" width="150" height="22" rx="11" fill="#d7dce5" fill-opacity="0.80"/>
    <rect x="196" y="422" width="300" height="18" rx="9" fill="#f0717b" fill-opacity="0.75"/>

    <!-- Divider above the input area -->
    <rect x="100" y="520" width="824" height="4" fill="#ffffff" fill-opacity="0.10"/>
  </g>

  <!-- Prompt and cursor -->
  <polyline points="214,612 344,702 214,792" fill="none" stroke="url(#accent)"
            stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="424" y="750" width="236" height="60" rx="30" fill="#8fd694"/>

  <!-- Light edge, to set the icon off against a dark background -->
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none"
        stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>
</svg>
