# RTerm's built-in themes.
#
# To add your own, copy a block into ~/.config/rterm/themes/<name>.toml
# (without the [[theme]] line) and change the colors.

[[theme]]
name = "RTerm Dark"
background = "#101216"
foreground = "#d7dce5"
cursor = "#6cb6ff"
selection = "#2b3a55"
muted = "#7d8696"
normal = { black = "#1c1f26", red = "#f0717b", green = "#8fd694", yellow = "#f2c97d", blue = "#6cb6ff", magenta = "#c59bf5", cyan = "#5fd4d0", white = "#c3c9d4" }
